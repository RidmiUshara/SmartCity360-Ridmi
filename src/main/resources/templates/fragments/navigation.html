<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- Keep the existing fragment name so every module uses the new horizontal navigation without changing routes. -->
  <div th:fragment="sidebar(active)" class="top-nav-wrapper">
    <header class="top-nav">
      <a class="top-brand" href="/" aria-label="SmartCity360 home">
        <span class="top-brand-symbol" aria-hidden="true">◈</span>
        <span class="top-brand-name">SmartCity<span>360</span><small>City Operations</small></span>
      </a>
      <nav class="top-links" aria-label="Main navigation">
        <a href="/" th:classappend="${active == 'dashboard'} ? ' active' : ''">Dashboard</a>
        <a href="/energy" th:classappend="${active == 'energy'} ? ' active' : ''">Energy</a>
        <a href="/zones" th:classappend="${active == 'zones'} ? ' active' : ''">Zones</a>
        <a href="/complaints" th:classappend="${active == 'complaints'} ? ' active' : ''">Complaints</a>
        <a href="/lights" th:classappend="${active == 'lights'} ? ' active' : ''">Streetlights</a>
        <a href="/policies" th:classappend="${active == 'policies'} ? ' active' : ''">Policy Studio</a>
      </nav>
      <div class="top-nav-end">
        <span class="top-environment"><i></i><span>Demo</span></span>
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to dark theme" title="Toggle dark / light theme"><span aria-hidden="true">☾</span></button>
        <span class="top-user" title="City Operations">SC</span>
      </div>
    </header>
  </div>
</body>
</html>
