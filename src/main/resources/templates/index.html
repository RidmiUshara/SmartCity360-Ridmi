
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartCity360 | Ridmi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            color: #1e293b;
        }
        header {
            background: #142d4e;
            color: white;
            padding: 30px;
            text-align: center;
        }
        main {
            max-width: 950px;
            margin: 40px auto;
            padding: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #00000010;
        }
        .card h3 { color: #1d4ed8; }
    </style>
</head>
<body>
<header>
    <h1>SmartCity360</h1>
    <p>Smart City Management Platform</p>
    <p>Object Oriented Design Patterns II</p>
</header>

<main>
    <h2>System Modules</h2>
    <div class="grid">
        <div class="card">
            <h3>Energy Security</h3>
            <p>Decorator Pattern</p>
        </div>
        <div class="card">
            <h3>Smart Zones</h3>
            <p>Composite Pattern</p>
        </div>
        <div class="card">
            <h3>Citizen Complaints</h3>
            <p>Chain of Responsibility</p>
        </div>
        <div class="card">
            <h3>Smart Street Lights</h3>
            <p>Flyweight Pattern</p>
        </div>
        <div class="card">
            <h3>City Policy Rules</h3>
            <p>Interpreter Pattern</p>
        </div>
    </div>
</main>
</body>
</html>
